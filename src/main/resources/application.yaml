server:
  port: 8080

spring:
  application:
    name: approval-workflow-engine
  datasource:
    url: jdbc:h2:mem:workflowdb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always

app:
  jwt:
    secret: change-this-to-a-long-random-secret-key-at-least-32-chars
    expiration-ms: 3600000